name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/*/package-lock.json

      - name: Install deps
        run: |
          npm ci --prefix packages/shared
          npm ci --prefix packages/client

      - name: Build static app
        run: cd packages/client && npm run build
        env:
          # Адрес бэкенда в репозиторий-переменной SERVER_URL
          # (wss://your-app.xxx). Без значения — клиент возьмёт window.location
          # как в config.ts.
          VITE_SERVER_URL: ${{ vars.SERVER_URL || '' }}
          # Подпапка Pages = имени репозитория (для user.github.io/repo).
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4